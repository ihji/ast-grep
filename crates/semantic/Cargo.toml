[package]
name = "ast-grep-semantic"
version = "0.1.0"
authors = ["Heejong Lee <heejong@gmail.com>"]
license = "MIT"
description = "Semantic analysis module for ast-grep"

edition.workspace = true
rust-version.workspace = true

[dependencies]
ast-grep-core = { workspace = true }
ast-grep-language = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
petgraph = "0.8.2"
bitvec = "1"
string-interner = "0.19.0"
derive-visitor = { version = "0.4.0", features = ["std-types-drive"] }

clap = { version = "4.5.4", features = ["derive"] }
type-sitter = { version = "0.8.0", default-features = false }

[build-dependencies]
type-sitter-gen = "0.8.0"
tree-sitter-go = "0.25.0"
